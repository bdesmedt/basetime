<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inloggen — Basetime KPI-dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb; --page-plane: #f9f9f7;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
    --border: rgba(11,11,11,0.10); --series-1: #2a78d6; --status-critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1: #1a1a19; --page-plane: #0d0d0d;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --border: rgba(255,255,255,0.10); --series-1: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
               background: var(--page-plane); color: var(--text-primary); }
  .shell { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
          padding: 28px 30px 26px; width: 100%; max-width: 380px; }
  h1 { font-size: 18px; font-weight: 650; margin: 0 0 4px; }
  p.sub { font-size: 13px; color: var(--text-secondary); margin: 0 0 20px; }
  label { display: block; font-size: 11.5px; color: var(--text-muted); margin: 12px 0 4px; }
  input { font: inherit; font-size: 14px; width: 100%; padding: 9px 11px; border-radius: 7px;
          border: 1px solid var(--border); background: var(--page-plane); color: var(--text-primary); }
  input:focus { outline: 2px solid var(--series-1); outline-offset: 1px; }
  button { margin-top: 20px; width: 100%; font: inherit; font-size: 14px; font-weight: 600;
           padding: 10px; border-radius: 7px; border: none; background: var(--series-1);
           color: #fff; cursor: pointer; }
  button:hover { filter: brightness(1.07); }
  .melding { background: rgba(208,59,59,0.12); border: 1px solid var(--status-critical, #d03b3b);
             border-radius: 8px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 16px; }
  .foot { font-size: 11.5px; color: var(--text-muted); margin: 18px 0 0; line-height: 1.5; }
</style>
</head>
<body>
<div class="shell">
  <form class="card" method="post" action="/login">
    <h1>Basetime KPI-dashboard</h1>
    <p class="sub">Log in met je persoonlijke account.</p>
    <div class="melding" style="display:{{MELDINGWEERGAVE}}">{{MELDING}}</div>
    <label for="email">E-mailadres</label>
    <input type="text" id="email" name="email" value="{{EMAIL}}" autocomplete="username" autofocus required>
    <label for="password">Wachtwoord</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit">Inloggen</button>
    <p class="foot">Geen account of wachtwoord kwijt? Vraag de beheerder om een nieuwe
      uitnodigingslink — wachtwoorden kunnen niet worden opgezocht, alleen opnieuw ingesteld.</p>
  </form>
</div>
</body>
</html>
